name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Language split check
        run: |
          metal=$(find Sources -name '*.metal' -print0 | xargs -0 cat | wc -c)
          swift=$(find . -name '*.swift' -not -path './.build/*' -print0 | xargs -0 cat | wc -c)
          echo "metal=$metal swift=$swift"; [ "$metal" -gt "$swift" ]
